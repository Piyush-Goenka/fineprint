name: Refresh public model rankings

on:
  schedule:
    - cron: "17 * * * *" # hourly discovery without paid model evaluations
  workflow_dispatch:
    inputs:
      test_slack:
        description: Send a test ranking notification to Slack
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog and public ranking data
        id: refresh
        run: python3 -m fineprint.market_data

      - name: Prepare Slack update
        id: summary
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_SLACK: ${{ inputs.test_slack }}
        run: python3 -m fineprint.market_notifications

      - name: Commit updated snapshot
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- fineprint/web/lib/market-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Public rankings are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fineprint/web/lib/market-data.json
          git commit -m "chore: refresh public model rankings"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
